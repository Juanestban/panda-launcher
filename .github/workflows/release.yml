# Publishes a GitHub release when a version tag is pushed (see RELEASING.md):
#   git tag v0.2.0 && git push origin v0.2.0
# The in-app updater (panda-core/src/update.rs) needs the assets below with exactly these names.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # Starts the website rebuild below.
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PANDA_MSA_CLIENT_ID: ${{ secrets.PANDA_MSA_CLIENT_ID }}
      PANDA_UPDATE_PUBLIC_KEY: ${{ vars.PANDA_UPDATE_PUBLIC_KEY }}
      PANDA_UPDATE_SIGNING_KEY: ${{ secrets.PANDA_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # WiX 5 runs as a .NET tool (dotnet-tools.json).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # No keys are required. PANDA_MSA_CLIENT_ID enables Microsoft sign in; the two update keys are optional
      # hardening (RELEASING.md). Unset secrets arrive as empty strings, which the code treats as "not set".
      - name: Tag matches the Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Cargo.toml"
          }
          if (-not $env:PANDA_MSA_CLIENT_ID) { Write-Warning "PANDA_MSA_CLIENT_ID is not set: this build can't sign in with Microsoft." }

      # Only when signing is turned on: a compiled-in key without matching .sig files would make every
      # later update fail for the people who install this build.
      - name: Signing keys match
        if: ${{ vars.PANDA_UPDATE_PUBLIC_KEY != '' }}
        shell: pwsh
        run: |
          if (-not $env:PANDA_UPDATE_SIGNING_KEY) { throw "PANDA_UPDATE_PUBLIC_KEY is set but PANDA_UPDATE_SIGNING_KEY is not" }
          $public = cargo run --quiet --locked -p panda-core --example sign -- --public
          if ($public.Trim() -ne $env:PANDA_UPDATE_PUBLIC_KEY.Trim()) { throw "PANDA_UPDATE_PUBLIC_KEY doesn't match PANDA_UPDATE_SIGNING_KEY" }

      - name: Test
        run: cargo test --workspace --locked

      # target\dist: the MSI, the portable exe, SHA256SUMS.txt, and .sig files when signing is on.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Panda Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: target/dist/*

      # A release made with GITHUB_TOKEN triggers no workflows, so start the site rebuild explicitly.
      - name: Redeploy the website with the new download
        shell: pwsh
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
