[package]
name = "panda-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panda-core = { path = "../panda-core" }
# ADR 0002: zgui is 0.x and changes often; bump this rev on purpose, never implicitly.
zgui = { git = "https://github.com/zortax/zgui", rev = "6684d362c857590ce860f50d6fe1abd97d04c535", features = ["tokio"] }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "6684d362c857590ce860f50d6fe1abd97d04c535" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "6684d362c857590ce860f50d6fe1abd97d04c535" }
zgui-ui-icons = { git = "https://github.com/zortax/zgui", rev = "6684d362c857590ce860f50d6fe1abd97d04c535" }
# Decodes the window icon; already built as part of zgui.
zgui-image = { git = "https://github.com/zortax/zgui", rev = "6684d362c857590ce860f50d6fe1abd97d04c535" }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

# Embeds assets/icon/panda.ico in the Windows exe (Explorer, taskbar pin, MSI shortcut).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
