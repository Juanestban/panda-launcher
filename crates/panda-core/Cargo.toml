[package]
name = "panda-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "stream"] }
