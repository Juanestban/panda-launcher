[package]
name = "panda-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3.34"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
